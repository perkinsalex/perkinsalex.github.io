<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What I'm reading</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600&display=swap">
<style>
:root{--bg:#f2f4f8;--surface:#fff;--ink:#18202f;--muted:#69728a;--line:#dde2ec;--loved:#1f8a5b;--liked:#b57a0c;--disliked:#b5483f}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--surface:#192030;--ink:#eaeef7;--muted:#98a1b8;--line:#2a3347;--loved:#4cc791;--liked:#e2b04a;--disliked:#e57c72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 18px 60px}
h1{font:600 32px/1.1 "Newsreader",Georgia,serif;margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 18px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.tab{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.rank{width:26px;color:var(--muted);font-size:14px;text-align:right}
.info{flex:1;min-width:0}
.t{font:600 18px/1.25 "Newsreader",Georgia,serif;overflow-wrap:anywhere}
.a{color:var(--muted);font-size:14px}
.score{font:600 20px "Newsreader",Georgia,serif;min-width:52px;text-align:center;border-radius:8px;padding:4px 8px;color:#fff}
.score.loved{background:var(--loved)}.score.liked{background:var(--liked)}.score.disliked{background:var(--disliked)}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line);border-radius:10px}
textarea{width:100%;height:140px;font:13px/1.4 ui-monospace,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-top:10px}
</style>
</head>
<body>
<main>
  <h1 id="ttl">What I'm reading</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="list"></div>
  <div id="paste" hidden>
    <div class="empty">No list found yet. In Shelf Rank, tap Export, then paste the data below to preview it.</div>
    <textarea id="ta" placeholder="Paste exported list data here"></textarea>
  </div>
</main>
<script>
// To bake your list into this file, paste the exported data between the parentheses below, e.g. const EMBEDDED = {...};
const EMBEDDED = null;
// Otherwise, put list.json (the exported data) next to this file on your site and this page loads it automatically.
const TITLE = "What I'm reading";

const GENRES = [["fiction","Fiction"],["history","History"],["sociology","Sociology"],["memoir","Memoir"]];
const TIERS = {loved:{lo:6.7,hi:10}, liked:{lo:3.4,hi:6.6}, disliked:{lo:0.1,hi:3.3}};
const ORDER = ["loved","liked","disliked"];
let data = null, tab = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = (g,t) => ((data.ranked || {})[g] || {})[t] || [];
const score = (g,t,i) => { const n = L(g,t).length, r = TIERS[t]; return (r.lo + (r.hi - r.lo) * (n - i - 0.5) / n).toFixed(1); };
const count = g => ORDER.reduce((s,t) => s + L(g,t).length, 0);

function render(){
  document.getElementById("ttl").textContent = TITLE;
  document.getElementById("paste").hidden = !!data;
  if (!data){ document.getElementById("tabs").innerHTML = ""; document.getElementById("list").innerHTML = ""; document.getElementById("sub").textContent = ""; return; }
  const want = data.want || [];
  const tabs = GENRES.filter(([g]) => count(g)).concat(want.length ? [["want","Want to read"]] : []);
  if (!tabs.some(([k]) => k === tab)) tab = tabs.length ? tabs[0][0] : null;
  const total = GENRES.reduce((s,[g]) => s + count(g), 0);
  document.getElementById("sub").textContent = total + (total === 1 ? " book ranked" : " books ranked") + (want.length ? ", " + want.length + " on the want-to-read list" : "");
  const tb = document.getElementById("tabs");
  tb.innerHTML = tabs.map(([k,l]) => `<button class="tab" role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join("");
  tb.querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const el = document.getElementById("list");
  if (!tab){ el.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  if (tab === "want"){
    el.innerHTML = want.map(b => `<div class="row"><div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author || "")}</div></div></div>`).join("");
    return;
  }
  let k = 0;
  el.innerHTML = ORDER.map(t => L(tab,t).map((b,i) => `<div class="row">
    <div class="rank">${++k}</div>
    <div class="info"><div class="t">${esc(b.title)}</div>${b.author ? `<div class="a">${esc(b.author)}</div>` : ""}</div>
    <div class="score ${t}">${score(tab,t,i)}</div></div>`).join("")).join("");
}

function accept(obj){ if (obj && (obj.ranked || obj.want)){ data = obj; render(); return true; } return false; }

document.getElementById("ta").addEventListener("input", e => {
  try { accept(JSON.parse(e.target.value)); } catch(err){}
});

(async () => {
  if (EMBEDDED && accept(EMBEDDED)) return;
  try {
    const r = await fetch("list.json", {cache:"no-store"});
    if (r.ok && accept(await r.json())) return;
  } catch(e){}
  render();
})();
</script>
</body>
</html>
